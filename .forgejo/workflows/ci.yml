name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  GIT_DEPTH: 0

jobs:
  legacy-kernel-module:
    runs-on: docker
    container:
      image: ubuntu:16.04
    env:
      SOURCE_URL: ${{ forgejo.server_url }}/${{ forgejo.repository }}.git
      SOURCE_SHA: ${{ forgejo.sha }}
    steps:
      - name: Compile DKMS module against Linux 4.4
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git gcc make linux-headers-generic
          git clone --no-checkout "$SOURCE_URL" /tmp/msicontroller
          git -C /tmp/msicontroller checkout --detach "$SOURCE_SHA"
          test "$(git -C /tmp/msicontroller rev-parse HEAD)" = "$SOURCE_SHA"
          build_dir="$(find /lib/modules -mindepth 2 -maxdepth 2 -name build | head -n 1)"
          test -n "$build_dir"
          kernel_version="$(basename "$(dirname "$build_dir")")"
          case "$kernel_version" in 4.4.*) ;; *) echo "Expected Linux 4.4 headers, got $kernel_version" >&2; exit 1 ;; esac
          mkdir -p /tmp/msicontroller-module
          cp /tmp/msicontroller/src/module/msiecmodule.c /tmp/msicontroller/cmake/packaging/dkms/Makefile /tmp/msicontroller-module/
          make -C /tmp/msicontroller-module KERNELRELEASE="$kernel_version"
          test -s /tmp/msicontroller-module/msiecmodule.ko

  all-in-one:
    runs-on: docker
    container:
      image: ubuntu:25.10
    steps:
      - name: Install Node.js and git
        run: |
          apt-get update
          apt-get install -y curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-charts-dev qt6-qmltooling-plugins libdbus-1-dev dbus-daemon libsystemd-dev \
            linux-headers-generic clang-tools clang-tidy clazy \
            dpkg-dev file rpm
          
          # Находим установленную версию kernel headers для передачи в CMake
          INSTALLED_KERNEL=$(ls /lib/modules/ | grep generic | head -1)
          echo "Found kernel headers: $INSTALLED_KERNEL"
          echo "KERNEL_VERSION=$INSTALLED_KERNEL" >> $GITHUB_ENV

      - name: Build project
        run: |
          mkdir -p build
          cd build
          # Передаем найденную версию ядра в CMake
          echo "Building with KERNEL_VERSION=$KERNEL_VERSION"
          export KERNEL_VERSION=$KERNEL_VERSION
          cmake .. -G Ninja
          cmake --build .

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Clazy check
        run: |
          mkdir -p build
          export CLAZY_CHECKS=level1
          export CXX_FLAGS="-Werror -Wall -Wextra"
          cd build
          cmake .. -G Ninja -DCMAKE_CXX_COMPILER=clazy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_FLAGS="-Werror -Wall -Wextra"
          cmake --build . --parallel

      - name: Sync to GitHub
        if: startsWith(github.ref, 'refs/heads/main')
        env:
          GITHUBTOKEN: ${{ secrets.GITHUBTOKEN }}
        run: |
          git checkout main
          git branch --set-upstream-to=origin/main main || true
          git pull --rebase origin main
          git push https://$GITHUBTOKEN@github.com/AcNasDev/MsiController.git

  packages:
    runs-on: docker
    container:
      image: ubuntu:22.04
    env:
      GIT_DEPTH: 0
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MSICONTROLLER_QT_VERSION: 6.11.1
      MSICONTROLLER_PACKAGE_REPOSITORY_ENABLE: "ON"
      MSICONTROLLER_PACKAGE_REPOSITORY_BASE_URL: https://forgejo.acnas.net
      MSICONTROLLER_PACKAGE_REPOSITORY_OWNER: app
      MSICONTROLLER_PACKAGE_DEBIAN_DISTRIBUTION: stable
      MSICONTROLLER_PACKAGE_DEBIAN_COMPONENT: main
      MSICONTROLLER_PACKAGE_RPM_GROUP: ""
      MSICONTROLLER_HTTP_PROXY: ${{ secrets.MSICONTROLLER_HTTP_PROXY }}
      http_proxy: ${{ secrets.MSICONTROLLER_HTTP_PROXY }}
      https_proxy: ${{ secrets.MSICONTROLLER_HTTP_PROXY }}
      HTTP_PROXY: ${{ secrets.MSICONTROLLER_HTTP_PROXY }}
      HTTPS_PROXY: ${{ secrets.MSICONTROLLER_HTTP_PROXY }}
    steps:
      - name: Install Node.js and git
        run: |
          apt-get update
          apt-get install -y curl ca-certificates
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install package build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake dpkg-dev file libdbus-1-dev libegl1-mesa-dev \
            libfontconfig1-dev libfreetype-dev libgl1-mesa-dev libsystemd-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-render0 libxcb-shape0 libxcb-util1 \
            libxkbcommon-dev libxkbcommon-x11-0 ninja-build pkg-config \
            python3 python3-pip rpm

      - name: Install Qt with aqtinstall
        run: |
          chmod +x scripts/install-qt-aqt.sh
          scripts/install-qt-aqt.sh

      - name: Build bundled DEB/RPM packages
        run: |
          chmod +x scripts/build-packages.sh
          scripts/build-packages.sh

      - name: Upload packages
        uses: actions/upload-artifact@v3
        with:
          name: msicontroller-packages
          path: packages/*

  arch-package:
    runs-on: docker
    container:
      image: archlinux:base-devel
    steps:
      - name: Install action runtime and Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            nodejs git base-devel cmake ninja qt6-base qt6-declarative \
            qt6-tools dkms systemd dbus kmod

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build native Arch package
        run: |
          useradd -m builder
          chown -R builder:builder .
          runuser -u builder -- scripts/build-arch-package.sh

      - name: Upload Arch package
        uses: actions/upload-artifact@v3
        with:
          name: msicontroller-arch-package
          path: packages/*.pkg.tar.zst

  arch-package-install-tests:
    needs: arch-package
    runs-on: docker
    container:
      image: archlinux:base-devel
    steps:
      - name: Install action runtime and package dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            nodejs git curl qt6-base qt6-declarative dkms systemd dbus kmod

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Arch package
        uses: actions/download-artifact@v3
        with:
          name: msicontroller-arch-package
          path: packages

      - name: Install package smoke test
        run: |
          set -e
          package_info="$(bsdtar -xOf packages/msicontroller-*.pkg.tar.zst .PKGINFO)"
          ! printf '%s\n' "$package_info" | grep -Eq '^depend = linux($|[-<>=])'
          headers=/tmp/linux-lts-headers-5.10.70-1-x86_64.pkg.tar.zst
          curl -fsSL --retry 3 -o "$headers" \
            https://archive.archlinux.org/packages/.all/linux-lts-headers-5.10.70-1-x86_64.pkg.tar.zst
          printf '%s  %s\n' a4a043f37f556b8c36f8feffe9b1a508afe1d507bc5dabd3674863fdacc2177d "$headers" | sha256sum -c -
          pacman -U --noconfirm "$headers"
          # The DKMS pacman hook requires the kernel module tree as well as headers.
          mkdir -p /usr/lib/modules/5.10.70-1-lts/kernel
          pacman-key --init
          pacman -U --noconfirm packages/msicontroller-*.pkg.tar.zst
          pacman-conf --repo-list | grep -Fx 'app.stable.forgejo.acnas.net'
          LC_ALL=C pacman-key --finger BB7BF0EFF45C1C45AEBE81F757A1F2EA20FE92F7 | grep -F '[  full  ]'
          systemctl is-enabled --quiet msi-ec-service.service
          test -f /usr/share/libalpm/hooks/90-msicontroller-service.hook
          installed_version="$(pacman -Q msicontroller | awk '{print $2}')"
          module_version="${installed_version%-*}"
          test -x /usr/bin/MsiControlCenterClient
          test -x /usr/bin/MsiControlCenterService
          test -x /usr/bin/MsiControllerDoctor
          test -f /usr/src/msiecmodule-${module_version}/dkms.conf
          grep -Fx "PACKAGE_VERSION=\"${module_version}\"" /usr/src/msiecmodule-${module_version}/dkms.conf
          dkms status -m msiecmodule -v "$module_version" -k 5.10.70-1-lts | grep -F 'installed'
          module_file="$(find /usr/lib/modules/5.10.70-1-lts/updates/dkms -maxdepth 1 -name 'msiecmodule.ko*' -print -quit)"
          test -n "$module_file"
          modinfo -F vermagic "$module_file" | grep -q '^5\.10\.70-1-lts '
          test -f /usr/lib/systemd/system/msi-ec-service.service
          test -f /etc/dbus-1/system.d/msi-ec-service.conf
          test -f /usr/share/applications/msi-control-center.desktop
          test ! -e /etc/modules-load.d/msiecmodule.conf
          doctor_output="$(/usr/bin/MsiControllerDoctor --json || true)"
          printf '%s\n' "${doctor_output}" | grep -F "\"clientVersion\": \"${module_version}\""
          for binary in MsiControlCenterClient MsiControlCenterService MsiControllerDoctor; do
            ! ldd "/usr/bin/${binary}" | grep -q 'not found'
          done
          pacman -R --noconfirm msicontroller
          ! pacman-conf --repo-list | grep -Fx 'app.stable.forgejo.acnas.net'
          ! grep -Fq '# BEGIN MsiController Forgejo repository' /etc/pacman.conf

  package-install-tests:
    needs: packages
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04-deb
            image: ubuntu:22.04
          - name: ubuntu-24.04-deb
            image: ubuntu:24.04
          - name: ubuntu-26.04-deb
            image: ubuntu:26.04
          - name: debian-12-deb
            image: debian:12
          - name: fedora-rpm
            image: fedora:latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install action runtime
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y curl ca-certificates gnupg
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y nodejs git bash
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y nodejs git bash ca-certificates
          else
            echo "Unsupported package manager" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download packages
        uses: actions/download-artifact@v3
        with:
          name: msicontroller-packages
          path: packages

      - name: Install package smoke test
        env:
          MSICONTROLLER_SKIP_DKMS: "1"
          MSICONTROLLER_DISABLE_REPOSITORY_SETUP: "1"
        run: |
          chmod +x scripts/test-package-install.sh
          scripts/test-package-install.sh packages

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - all-in-one
      - packages
      - package-install-tests
      - arch-package
      - arch-package-install-tests
    runs-on: docker
    container:
      image: ubuntu:22.04
    steps:
      - name: Install Node.js and release tools
        run: |
          apt-get update
          apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs git python3 rpm libarchive-tools

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download packages
        uses: actions/download-artifact@v3
        with:
          name: msicontroller-packages
          path: packages

      - name: Download Arch package
        uses: actions/download-artifact@v3
        with:
          name: msicontroller-arch-package
          path: packages

      - name: Publish Forgejo package registry
        env:
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          FORGEJO_ACTOR: ${{ secrets.PACKAGE_PUBLISH_ACTOR }}
          MSICONTROLLER_FORGEJO_PACKAGE_OWNER: app
          MSICONTROLLER_FORGEJO_DEBIAN_DISTRIBUTION: stable
          MSICONTROLLER_FORGEJO_DEBIAN_COMPONENT: main
          MSICONTROLLER_FORGEJO_RPM_GROUP: ""
          MSICONTROLLER_FORGEJO_ARCH_GROUP: stable
        run: |
          chmod +x scripts/publish-forgejo-packages.sh
          scripts/publish-forgejo-packages.sh packages

      - name: Publish Forgejo release
        env:
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          RELEASE_TAG: ${{ forgejo.ref_name }}
          RELEASE_SHA: ${{ forgejo.sha }}
        run: |
          set -euo pipefail

          create_payload="$(python3 - <<'PY'
          import json
          import os

          tag = os.environ["RELEASE_TAG"]
          sha = os.environ["RELEASE_SHA"]
          print(json.dumps({
              "tag_name": tag,
              "target_commitish": sha,
              "name": tag,
              "body": f"Automated package release for {tag}.",
              "draft": False,
              "prerelease": "-" in tag,
          }))
          PY
          )"

          release_json="$(curl -fsS \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            || true)"

          if [ -z "${release_json}" ]; then
            release_json="$(curl -fsS \
              -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${create_payload}" \
              "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/releases")"
          else
            release_id="$(printf '%s' "${release_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
            release_json="$(curl -fsS \
              -X PATCH \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${create_payload}" \
              "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/releases/${release_id}")"
          fi

          release_id="$(printf '%s' "${release_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          assets_json="$(curl -fsS \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/releases/${release_id}/assets")"

          for package in packages/msicontroller_amd64.deb packages/msicontroller_x86_64.rpm packages/msicontroller-*.pkg.tar.zst; do
            name="$(basename "${package}")"
            asset_id="$(ASSETS_JSON="${assets_json}" ASSET_NAME="${name}" python3 - <<'PY'
          import json
          import os

          name = os.environ["ASSET_NAME"]
          for asset in json.loads(os.environ["ASSETS_JSON"]):
              if asset.get("name") == name:
                  print(asset["id"])
                  break
          PY
          )"

            if [ -n "${asset_id}" ]; then
              curl -fsS \
                -X DELETE \
                -H "Authorization: token ${FORGEJO_TOKEN}" \
                "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/releases/${release_id}/assets/${asset_id}"
            fi

            curl -fsS \
              -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${package};filename=${name}" \
              "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/releases/${release_id}/assets?name=${name}"
          done

      - name: Publish GitHub release
        env:
          GITHUBTOKEN: ${{ secrets.GITHUBTOKEN }}
          GITHUB_REPOSITORY: AcNasDev/MsiController
          RELEASE_TAG: ${{ forgejo.ref_name }}
          RELEASE_SHA: ${{ forgejo.sha }}
        run: |
          set -euo pipefail

          if [ -z "${GITHUBTOKEN:-}" ]; then
            echo "::warning::GITHUBTOKEN secret is empty; skipping GitHub release"
            exit 0
          fi

          git push "https://x-access-token:${GITHUBTOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          create_payload="$(python3 - <<'PY'
          import json
          import os

          tag = os.environ["RELEASE_TAG"]
          sha = os.environ["RELEASE_SHA"]
          print(json.dumps({
              "tag_name": tag,
              "target_commitish": sha,
              "name": tag,
              "body": f"Automated package release for {tag}.",
              "draft": False,
              "prerelease": "-" in tag,
          }))
          PY
          )"

          github_api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          github_uploads="https://uploads.github.com/repos/${GITHUB_REPOSITORY}"
          github_headers=(
            -H "Authorization: Bearer ${GITHUBTOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          release_json="$(curl -fsS \
            "${github_headers[@]}" \
            "${github_api}/releases/tags/${RELEASE_TAG}" \
            || true)"

          if [ -z "${release_json}" ]; then
            release_json="$(curl -fsS \
              -X POST \
              "${github_headers[@]}" \
              -H "Content-Type: application/json" \
              -d "${create_payload}" \
              "${github_api}/releases")"
          else
            release_id="$(printf '%s' "${release_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
            release_json="$(curl -fsS \
              -X PATCH \
              "${github_headers[@]}" \
              -H "Content-Type: application/json" \
              -d "${create_payload}" \
              "${github_api}/releases/${release_id}")"
          fi

          release_id="$(printf '%s' "${release_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          assets_json="$(curl -fsS \
            "${github_headers[@]}" \
            "${github_api}/releases/${release_id}/assets")"

          for package in packages/msicontroller_amd64.deb packages/msicontroller_x86_64.rpm packages/msicontroller-*.pkg.tar.zst; do
            name="$(basename "${package}")"
            asset_id="$(ASSETS_JSON="${assets_json}" ASSET_NAME="${name}" python3 - <<'PY'
          import json
          import os

          name = os.environ["ASSET_NAME"]
          for asset in json.loads(os.environ["ASSETS_JSON"]):
              if asset.get("name") == name:
                  print(asset["id"])
                  break
          PY
          )"

            if [ -n "${asset_id}" ]; then
              curl -fsS \
                -X DELETE \
                "${github_headers[@]}" \
                "${github_api}/releases/assets/${asset_id}"
            fi

            curl -fsS \
              -X POST \
              "${github_headers[@]}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${package}" \
              "${github_uploads}/releases/${release_id}/assets?name=${name}"
          done
